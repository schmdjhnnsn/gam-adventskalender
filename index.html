<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generative Adventic Calendar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <h1>🎄 Generative Adventic Calendar</h1>
  <p id="status" role="status"></p>
  <p id="progress" class="progress"></p>
  <p id="notice" class="notice" hidden></p>
</header>
<main>
  <div id="grid" class="grid" aria-label="24 Türchen des Adventskalenders"></div>
</main>
<dialog id="door-dialog" aria-labelledby="door-title">
  <button id="dialog-close" class="dialog-close" aria-label="Schließen">×</button>
  <blockquote id="door-spruch"></blockquote>
  <h2 id="door-title"></h2>
  <p id="door-text"></p>
  <img id="door-img" alt="" loading="lazy">
  <p class="door-link-wrap"><a id="door-link" target="_blank" rel="noopener noreferrer"></a></p>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="notice">Dieser Adventskalender benötigt JavaScript, um das aktuelle Datum zu prüfen und die Türchen zu öffnen.</p></noscript>
<footer class="site-footer">
  <p>Entstanden im Rahmen von Generative Agentic Media - einem Projekt des SWR.</p>
  <p>Die Inhalte werden live aus einem Google-Sheet geladen. Kein Tracking, keine Cookies.</p>
</footer>
<script src="app.js" defer></script>
</body>
</html>
